<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="RK">
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#ff4777"/>
    </linearGradient>
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Transparent background so only the letters show -->
  <g transform="translate(256,274)" filter="url(#dropshadow)">
    <text x="0" y="0" text-anchor="middle" dominant-baseline="middle"
      font-family="Helvetica, Arial, system-ui, -apple-system, 'Inter', sans-serif"
      font-weight="800"
      font-size="300"
      letter-spacing="-8"
      fill="url(#g1)">
      RK
    </text>
  </g>
</svg>
