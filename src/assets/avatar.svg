<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="a" x1="0" x2="1">
      <stop offset="0%" stop-color="#ff7a59"/>
      <stop offset="100%" stop-color="#ff4777"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#0b2438" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- rounded card background -->
  <rect x="40" y="40" width="432" height="432" rx="28" ry="28" fill="url(#a)" filter="url(#shadow)" />

  <!-- soft inner circle to hold initials -->
  <circle cx="256" cy="256" r="110" fill="#ffffff" opacity="0.06" />
  <circle cx="256" cy="256" r="78" fill="rgba(255,255,255,0.06)" />

  <!-- initials -->
  <text x="256" y="285" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-weight="700" font-size="86" fill="#ffffff">RK</text>

</svg>
